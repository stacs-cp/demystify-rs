name: "demystify"

on:
  push:
    branches:
      - main # run for pushes to the main branch. other branches need to create a PR if they want testing.
  pull_request:
  workflow_dispatch:


jobs:
  build-and-test:
    name: "Build and Test"
    strategy:
      # run all combinations of the matrix even if one combination fails.
      fail-fast: false
      matrix:
        rust_release:
          - 1.94.1
          - stable
        conjure_version:
          - 2.5.1
        os:
          - ubuntu-latest
          - macos-latest
        include:
          - os: ubuntu-latest
            release_suffix: linux
            cargo_flags: "--workspace"
          - os: macos-latest
            release_suffix: macos-intel
            cargo_flags: "--workspace"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3

      - run: rustup update ${{ matrix.rust_release }} && rustup default ${{ matrix.rust_release }} && rustup component add clippy

      - run: cargo build -vv ${{ matrix.cargo_flags }}

      - run: cargo clippy ${{ matrix.cargo_flags }} -- -D warnings

      - run: cargo install cargo-audit --quiet || true
      - run: cargo audit

      - uses: ./.github/actions/install-conjure
        with:
          os_arch: ${{ matrix.release_suffix }}
          version: ${{ matrix.conjure_version }}

      - run: cargo test ${{ matrix.cargo_flags }}

      - run: bash scripts/test-some.sh

  wasm:
    name: "Wasm build and smoke test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust + wasm32 target
        run: rustup update stable && rustup default stable && rustup target add wasm32-unknown-unknown

      - name: Build demystify for wasm32
        run: cargo build -p demystify --target wasm32-unknown-unknown

      - name: Build demystify-wasm for wasm32
        run: cargo build -p demystify-wasm --target wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Package demystify-wasm with wasm-pack
        run: wasm-pack build --target web --release demystify-wasm

      - name: Run wasm-bindgen-test smoke tests under Node
        run: wasm-pack test --node demystify-wasm

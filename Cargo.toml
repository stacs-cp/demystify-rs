[workspace]
members = [
    "demystify",
    "demystify-web",
    "demystify-lua",
    "demystify-wasm",
    "demystify-builder",
]
resolver = "2"

# Keep optimisation at O3 but retain debug symbols so samply/perf can
# symbolise stack frames.  Costs some binary size; run-time is unaffected.
#
# We deliberately keep the default `panic = "unwind"` here.  Setting
# `panic = "abort"` shaves a little off the wasm binary (it drops the
# unwind tables / panic-format machinery), but the `demystify-lua` cdylib
# is loaded into LuaJIT via mlua, which carries Lua errors back across the
# Rust FFI boundary using the `C-unwind` ABI — and that needs stack
# unwinding.  Under `panic = "abort"` *every* mlua error (not just a Rust
# panic) aborts the host process with LuaJIT's "unprotected error in call
# to Lua API" instead of being catchable by `pcall`.  The size win wasn't
# worth breaking error handling, so don't re-add abort.
[profile.release]
debug = true

# Wasm doesn't need DWARF symbols (samply/perf can't read them in a
# browser anyway), and bandwidth matters more than build speed.
# `opt-level = "s"` is the gentle size optimisation — `"z"` is more
# aggressive but sometimes pessimises SAT-heavy code; revisit if a
# measurement shows it's worth it.
#
# `lto` and `codegen-units` are only valid at top-level `[profile.*]`,
# not in per-package overrides, so we don't set them here.  If the
# size gain from the knobs we *can* set isn't enough, promote
# `lto = "fat"` to `[profile.release]` — but that slows every release
# build (CLI included), not just the wasm.
[profile.release.package.demystify-wasm]
debug = false
strip = "symbols"
opt-level = "s"

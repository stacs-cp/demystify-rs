[package]
name = "demystify-builder"
version = "0.1.0"
edition = "2024"
description = "Build demystify puzzle inputs directly in Rust, bypassing Conjure"
license = "MPL-2.0"
repository = "https://github.com/stacs-cp/demystify-rs"
publish = false

[dependencies]
demystify = { path = "../demystify", version = "0.2" }
rustsat = { version = "0.7", features = ["ipasir-display"] }
anyhow = "1"
thiserror = "2"

[dev-dependencies]
demystify = { path = "../demystify", version = "0.2", features = ["deterministic"] }
rustsat-batsat = "0.7"
rand = "0.10"
rand_chacha = "0.10"
rayon = "1"

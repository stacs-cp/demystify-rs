[package]
name = "demystify"
version = "0.3.1"
edition = "2024"
rust-version = "1.94.1"
description = "A constraint solving tool for explaining puzzles"
license = "MPL-2.0"
repository = "https://github.com/stacs-cp/demystify-rs"
homepage = "https://github.com/stacs-cp/demystify-rs"
documentation = "https://docs.rs/demystify"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
# Trade throughput for reproducibility. With this feature enabled:
#   - the SAT core is rebuilt on every call (no learned-clause carry-over),
#   - the parallel MUS search reads its size bound from a snapshot taken
#     before the parallel pass instead of the live MusDict (workers no
#     longer prune based on each other's mid-pass discoveries).
# Use for regression tests, debugging, and reproducible benchmarks; do not
# enable for production runs — it is materially slower.
deterministic = []

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features=["env-filter"] }
tracing-appender = "0.2"
tracing-core = "0.1"
anyhow = "1.0"
rand = "0.10"
rand_chacha = "0.10"
itertools = "0.14"
serde = { version = "1.0", features=["rc", "derive"]}
serde_json = "1.0"
regex = "1.0"
tempfile = "3.10"
rustsat = { version = "0.7", features=["ipasir-display"] }
rustsat-batsat = "0.7"
test-log = "0.2"
tera = { version = "1.19", default-features = false }
rayon = "1.0"
thread_local = "1.1"
svg = "0.18"
thiserror = "2"
toml = "0.8"
web-time = "1"

# C/C++ SAT backends and conjure-runner deps don't build on wasm32.
# wasm uses BatSat only, and never invokes conjure/savilerow.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustsat-glucose = { version = "0.7" }
rustsat-cadical = "0.7.5"
which = "8"
# Parse cache: persistent, multi-process SQLite KV store; zstd to shrink the
# (highly compressible) parse JSON; sha2 to build the content+version key.
cute-sqlite-kv = "0.1.0"
zstd = "0.13"
sha2 = "0.10"

# Hash the crate source + lockfile at build time so the parse cache key changes
# whenever demystify's own parsing code (or a dependency version) changes.
[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
insta = "1"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "solve"
harness = false

[lib]
name = "demystify"
path = "src/lib.rs"

[[bin]]
name = "demystify"
path = "src/bin/main.rs"

[[bin]]
name = "demystify-makesvg"
path = "src/bin/makesvg.rs"

[[bin]]
name = "demystify-fingerprint"
path = "src/bin/fingerprint.rs"

[[bin]]
name = "demystify-walkthrough"
path = "src/bin/walkthrough.rs"

[dependencies.clap]
version = "4.0"
features = ["derive"]

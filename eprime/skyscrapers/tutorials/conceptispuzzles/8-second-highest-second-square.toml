model = "eprime/skyscrapers.eprime"
param = "eprime/skyscrapers/solving_techniques/conceptispuzzlescom/8-second-highest-second-square.param"
title = "skyscrapers — conceptispuzzles — 8-second-highest-second-square"

# Default first step: heatmap to show what is deducible at the start.
# Look at the rendered HTML, identify the cell + value the source
# tutorial demonstrates, then uncomment a `[[step]]` below.
[[step]]
op = "heatmap"
title = "Initial state — pick a target deduction from this"

# [[step]]
# op = "show_mus"
# lit = "<var>[r,c]=v"  # OR <var>[r,c]!=v for an elimination
# title = "<technique name from source>"


# Auto-filled from planner step 1.  Each [[step]] below shows the
# smallest MUS for one of the cells deducible at the initial state.
# Cross-reference with the source page to identify which deduction
# matches the technique being demonstrated.

[[step]]
op = "show_smallest_muses"
lit = "field[2,1]=1"
title = "Auto-target 1/4: field[2,1]=1"

[[step]]
op = "show_smallest_muses"
lit = "field[5,1]!=4"
title = "Auto-target 2/4: field[5,1]!=4"

[[step]]
op = "show_smallest_muses"
lit = "field[1,2]!=5"
title = "Auto-target 3/4: field[1,2]!=5"

[[step]]
op = "show_smallest_muses"
lit = "field[1,3]!=5"

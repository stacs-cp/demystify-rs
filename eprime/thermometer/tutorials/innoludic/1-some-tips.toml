# Source: https://www.innoludic.com/2015-04-30-13-56-29/thermometers/56-rules-of-thermometers.html
# Local mirror: doc/tutorial-source-pages/innoludic/_html/rules-of-thermometers.html
#
# The innoludic page describes the two basic Thermometer techniques on a
# 6x6 example puzzle, then introduces two advanced techniques ("Forced
# Move" and "Grouping") on a different, larger puzzle.  This walkthrough
# only covers the two basic techniques — the param file is the 6x6
# puzzle from the page's introductory section.
#
# Page techniques demonstrated:
#   1. "Overflowing"  — when a column/row clue is smaller than a
#                       thermometer's length in that column/row, the
#                       cells far from the circle cannot be filled.
#   2. "Backflow"     — when the column/row clue is large enough that
#                       it forces some cells of a long thermometer to
#                       be filled regardless of how the other
#                       thermometers' fluid is distributed.
#
# Puzzle layout (matches the page since 2026-10-11; grid[R,C] = row R, column C):
#   row_sums = [4, 1, 5, 5, 3, 2]
#   col_sums = [1, 3, 4, 3, 4, 5]
#   Therm 0 (length 5, horizontal in row 1, circle at (1,5), positions 1..5
#     going left along the row: (1,5) circle, (1,4), (1,3), (1,2), (1,1) far end).
#   Therm 1 (length 4, vertical in column 6, circle at (1,6) going down).
# NB the page's own Overflowing example is the bottom row (clue 2, a
# 4-cell thermometer); this walkthrough uses row 1 instead.  The paper
# proposals in paper-catalogue/targets use the page's example.

model = "eprime/thermometer.eprime"
param = "eprime/thermometer/solving_techniques/innoludic/1-some-tips.param"
title = "thermometer — innoludic — basic Overflowing + Backflow techniques"
hide_untouched_candidates = true
repeats = 200
strategy = "cake"

[[step]]
op = "heatmap"
title = "Initial state"

# =====================================================================
# Overflowing — row clue 4 < therm 0 length 5 — far end of therm 0
# cannot be mercury.
#
# Row 1 contains all 5 cells of therm 0 (horizontal) plus the circle of
# therm 1 at (1,6).  Row clue is 4.  Filling (1,1) — therm 0's
# furthest-from-circle cell (position 5) — would force every cell of
# therm 0 to be filled (5 cells) plus possibly therm 1's circle, giving
# at least 5 mercury in row 1, breaking the clue of 4.
# MUS: `{fluid[0], rowdown[1]}` — size 2.
# =====================================================================

[[step]]
op = "show_smallest_muses"
lit = "grid[1,1]=0"
title = "Overflowing: grid[1,1]=0 — row 1 clue 4 forbids filling the far end of therm 0 (length 5)"

[[step]]
op = "deduce"
lit = "grid[1,1]=0"

# =====================================================================
# Backflow — row clue 4 forces therm 0's circle to be filled even
# without knowing whether therm 1's circle is filled.
#
# Row 1 holds all 5 cells of therm 0 plus the circle of therm 1 at
# (1,6).  Row clue is 4.
#   Case A: therm 1's circle is filled — row 1 needs 3 more cells from
#           therm 0, which fills positions 1..3 (the circle + 2 above).
#   Case B: therm 1's circle is empty — row 1 needs all 4 from therm 0,
#           filling positions 1..4.
# Either way, therm 0's circle at (1,5) must be filled.  Equivalently:
# if (1,5) were empty, fluid[0] forces all of therm 0 empty (filled-far
# implies filled-close — contrapositive: empty-close forces empty-far),
# leaving row 1 with at most 1 mercury (just therm 1's circle), short
# of the clue.  MUS: `{fluid[0], rowup[1]}` — size 2.
# =====================================================================

[[step]]
op = "show_smallest_muses"
lit = "grid[1,5]=1"
title = "Backflow: grid[1,5]=1 — row 1 clue 4 forces therm 0's circle even without committing on therm 1"

[[step]]
op = "deduce"
lit = "grid[1,5]=1"

[[step]]
op = "heatmap"
title = "After both techniques"
commentary = "Page also covers two advanced techniques (Forced Move, Grouping) on a different, larger puzzle. This walkthrough only covers the two basic techniques applicable to the 6x6 example."

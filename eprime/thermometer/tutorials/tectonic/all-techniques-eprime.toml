# Source: http://www.tectonicpuzzel.eu/thermometer-sudoku-puzzle-solving-strategy.html
# Local mirror: doc/tutorial-source-pages/tectonicpuzzel/_html/thermometer-sudoku-puzzle-solving-strategy.html
#
# The tectonicpuzzel page lists 5 thermometer-puzzle techniques.  This
# walkthrough demonstrates the first four; the page's Rule 5 example
# ("Thermometers filled from circle") is not exercised on this puzzle
# (the page uses a different starting position for that one).
#
# Puzzle: 10x10, 25 thermometers.
#   row_sums = [7,8,9,5,8,6,1,4,3,4]
#   col_sums = [8,10,4,5,4,5,1,7,7,4]
# (NB: until 2026-10-11 the param was the page puzzle transposed; it
# now matches the page, whose column 2 has the all-mercury clue 10.)
#
# The model indexes therms[X,Y] as [column, row], so each inner array
# of the param's therms matrix is one column read top-to-bottom.  In
# `grid[R,C]` lits, R is the row, C the column, as on the page.
#
# Relevant therms for the demos below:
#   Therm 10: horizontal row 4, columns 4..10, length 7, circle at (4,10).
#   Therm 13: horizontal row 6, columns 2..5, length 4, circle at (6,2).

model = "eprime/thermometer.eprime"
param = "eprime/thermometer/solving_techniques/tectonicpuzzel/all-techniques.eprime"
title = "thermometer — tectonic — page Rules 1–4 walkthrough"
hide_untouched_candidates = true
repeats = 200
strategy = "cake"

[[step]]
op = "heatmap"
title = "Initial state"

# =====================================================================
# Rule 1 — "Number 0 or number 10".  Clue equal to width/height means
# the line is fully filled (or fully empty when 0).
# Column 2's clue is 10 (= grid width), so every cell in column 2 is mercury.
# MUS: `{colup[2]}` — size 1.
# =====================================================================

[[step]]
op = "show_smallest_muses"
lit = "grid[1,2]=1"
title = "Rule 1: grid[1,2]=1 — column 2 clue 10 = column height, every cell filled"

[[step]]
op = "deduce"
lit = "grid[1,2]=1"

# =====================================================================
# Rule 2 — "Number smaller than thermometer length" (Overflow).
# Row 4's clue is 5 but therm 10 is a 7-cell horizontal thermometer in
# the same row (columns 4..10, circle at column 10).  Filling any cell at
# position ≥6 forces ≥6 cells of row 4 to be mercury — over the clue.
# So the two cells furthest from the circle — therm 10 positions 7 and
# 6 at (4,4) and (4,5) — cannot be mercury.
# MUS: `{fluid[10], rowdown[4]}` — size 2 each.
# =====================================================================

[[step]]
op = "show_smallest_muses"
lit = "grid[4,4]=0"
title = "Rule 2 (Overflow): grid[4,4]=0 — row 4 clue 5 forbids the furthest end of therm 10 (length 7)"

[[step]]
op = "deduce"
lit = "grid[4,4]=0"

[[step]]
op = "show_smallest_muses"
lit = "grid[4,5]=0"
title = "Rule 2 (Overflow): grid[4,5]=0 — same row 4 / therm 10 reasoning"

[[step]]
op = "deduce"
lit = "grid[4,5]=0"

# =====================================================================
# Rule 3 — "Number bigger than the sum of thermometers" (Backflow).
# Row 4's clue is 5.  Row 4 holds therm 10 (length 7 horizontal) plus
# 3 cells from other thermometers (columns 1..3).  Those 3 cells can each
# contribute at most 1 mercury, giving ≤3 from non-therm-10 cells.
# So therm 10 itself must contribute ≥2 mercury cells — and because
# thermometers fill from the circle, those are at least the circle
# (4,10) and position 2 (4,9).
# MUS: `{fluid[10], rowup[4]}` — size 2 each.
# =====================================================================

[[step]]
op = "show_smallest_muses"
lit = "grid[4,10]=1"
title = "Rule 3 (Backflow): grid[4,10]=1 — row 4 clue 5 forces therm 10's circle"

[[step]]
op = "deduce"
lit = "grid[4,10]=1"

[[step]]
op = "show_smallest_muses"
lit = "grid[4,9]=1"
title = "Rule 3 (Backflow): grid[4,9]=1 — row 4 clue 5 forces therm 10's position 2"

[[step]]
op = "deduce"
lit = "grid[4,9]=1"

# =====================================================================
# Rule 4 — "Combine rows or columns".  Two lines with a big clue
# difference, plus a vertical/horizontal thermometer crossing them,
# combine to force a specific cell.  In our puzzle row 6 has clue 6
# and row 7 has clue 1 (difference of 5); the deduction this technique
# yields on this puzzle is grid[6,2]=mercury — therm 13's circle.
# =====================================================================

[[step]]
op = "show_smallest_muses"
lit = "grid[6,2]=1"
title = "Rule 4 (Combine rows/columns): grid[6,2]=1 — combining row 6 (clue 6) and row 7 (clue 1) forces therm 13's circle"

[[step]]
op = "deduce"
lit = "grid[6,2]=1"

[[step]]
op = "heatmap"
title = "After Rules 1–4"
commentary = "Page Rule 5 ('Thermometers filled from circle') is not exercised on this puzzle's starting state — the page uses a different example for it.  One additional step from the page narrative remains; not yet added."

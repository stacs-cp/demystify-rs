# Tutorial corpus manifest.  Generated; hand-edit OK afterwards.
# Cross-reference for paper: text/overleaf/600aea0f61b6de49eeda409c/main.tex Table 1.
#
# Status values:
#   located            = file/dotest exists in repo, target known
#   needs-source-page  = located but target deduction (paper-counted step) needs identifying
#   needs-multi-step   = single param contains multiple paper-counted deductions; need per-step targets
#   not-in-paper       = present in repo but excluded from paper Table 1 (Killer, unique-rectangles, …)
#   showcase           = full-puzzle solve trace, not a per-step technique


